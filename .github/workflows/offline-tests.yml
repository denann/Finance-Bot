name: Offline tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run complete offline suite
        env:
          ENABLE_LIVE_AI_EVAL: "0"
        run: python -m pytest -q tests
      - name: Compile application and tests
        run: python -m compileall -q app evals main.py tests
      - name: Import smoke
        run: python -c "from tests.fakes.external_modules import install_external_stubs; install_external_stubs(); import app.nlp.regex_parser, app.nlp.parse_safety, app.bot.pending_actions, evals.metrics, evals.gates"
      - name: Check whitespace
        run: git diff --check
